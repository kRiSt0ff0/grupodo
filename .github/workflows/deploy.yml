name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - gh-pages  # Cambia la rama de master a gh-pages para que el flujo se ejecute cuando haya un push a gh-pages

jobs:
  build:
    runs-on: ubuntu-latest  # El trabajo se ejecutará en un entorno Ubuntu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # Obtiene el código del repositorio

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1  # Configura Ruby, necesario para Jekyll
      with:
        ruby-version: 2.7  # Usando Ruby 2.7 (puedes ajustarlo si usas una versión diferente)

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install  # Instala las dependencias necesarias para Jekyll

    - name: Build the Jekyll site
      run: bundle exec jekyll build  # Construye el sitio usando Jekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4  # Usa la acción para desplegar el sitio
      with:
        branch: gh-pages  # Despliega en la rama gh-pages
        folder: _site  # Asegúrate de que _site es la carpeta donde Jekyll genera el sitio
        token: ${{ secrets.GITHUB_TOKEN }}  # Usa el token de GitHub para autenticación
