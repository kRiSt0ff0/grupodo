name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - gh-pages  # Ejecuta el flujo cuando haya un push a gh-pages

jobs:
  build:
    runs-on: windows-latest  # El trabajo se ejecutará en un entorno Windows

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2  # Obtiene el código del repositorio

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1  # Configura Ruby, necesario para Jekyll
      with:
        ruby-version: 2.7  # Usando Ruby 2.7 (ajusta si usas una versión diferente)

    - name: Install Bundler
      run: |
        gem install bundler -v 2.4.22  # Instalar Bundler usando RubyGems

    - name: Install dependencies
      run: bundle install  # Instalar las dependencias definidas en Gemfile

    - name: Build the Jekyll site
      run: bundle exec jekyll build  # Construir el sitio usando Jekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4  # Usa la acción para desplegar el sitio
      with:
        branch: gh-pages  # Despliega en la rama gh-pages
        folder: _site  # Asegúrate de que _site es la carpeta donde Jekyll genera el sitio
        token: ${{ secrets.GITHUB_TOKEN }}  # Usa el token de GitHub para autenticación
